    <meta name="description" content="Contact PSTU Entrepreneurship Club for inquiries, partnerships, and collaboration opportunities.">

    <meta property="og:description" content="Contact PSTU Entrepreneurship Club for inquiries, partnerships, and collaboration opportunities." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <link rel="stylesheet" href="assets/css/style.css" />

</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <section id="main" class="hero-section text-white position-relative"
        style="background: linear-gradient(rgba(12,0,50,0.85), rgba(12,0,50,0.85)), url('assets/images/contact-hero.jpg') center/cover no-repeat;">
        <div class="container py-5">
            <div class="row py-5">
                <div class="col-lg-8 mx-auto text-center">
                    <h1 class="hero-heading mb-4">Contact <span class="gradient-text">Us</span></h1>
                    <p class="hero-subtitle">Get in touch with our team</p>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Contact Info -->
    <section class="py-5 bg-light">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-4" data-aos="fade-up">
                    <div class="text-center p-4 feature-card h-100">
                        <i class="fas fa-map-marker-alt fa-3x text-primary mb-3"></i>
                        <h4>Our Location</h4>
                        <p>Entrepreneurship Club Office<br>Patuakhali Science and Technology University<br>Patuakhali,
                            Bangladesh</p>
                    </div>
                </div>
                <div class="col-md-4" data-aos="fade-up" data-aos-delay="100">
                    <div class="text-center p-4 feature-card h-100">
                        <i class="fas fa-envelope fa-3x text-primary mb-3"></i>
                        <h4>Email Us</h4>
                        <p>General Inquiries: <a href="mailto:info@pstuec.com">info@pstuec.com</a></p>
                    </div>
                </div>
                <div class="col-md-4" data-aos="fade-up" data-aos-delay="200">
                    <div class="text-center p-4 feature-card h-100">
                        <i class="fas fa-phone-alt fa-3x text-primary mb-3"></i>
                        <h4>Call Us</h4>
                        <p><a href="tel:01942627962">01942-627962</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Contact Form -->
    <section class="py-5">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 mx-auto">
                    <div class="card shadow-sm glass-card">
                        <div class="card-body p-5">
                            <h3 class="text-center mb-4">Send Us a Message</h3>
                            <form>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Your Name</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="subject" class="form-label">Subject</label>
                                    <input type="text" class="form-control" id="subject" required>
                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label">Message</label>
                                    <textarea class="form-control" id="message" rows="5" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Send Message</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="site-footer"></div>

    <!-- Back to Top Button -->
    <a href="#" class="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up" aria-hidden="true"></i></a>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script defer src="assets/js/script.js"></script>
    <script defer src="assets/js/ui.js"></script>
    <script>
        // Initialize AOS
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });

    </script>
</body>

</html>
