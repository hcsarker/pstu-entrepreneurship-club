<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - PSTU EC</title>
  <link href="/assets/css/style.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-4">Admin Dashboard</h1>
    <div id="loginBox" class="card p-3 mb-4" style="max-width:480px">
      <h4>Admin Login</h4>
      <div class="mb-2"><input id="adminUser" class="form-control" placeholder="Username" /></div>
      <div class="mb-2"><input id="adminPass" type="password" class="form-control" placeholder="Password" /></div>
      <div><button id="loginBtn" class="btn btn-primary">Sign in</button></div>
      <div id="loginMsg" class="text-danger small mt-2"></div>
    </div>

    <div id="adminApp" style="display:none">
      <div class="mb-3 d-flex gap-2">
        <button id="refreshBtn" class="btn btn-outline-secondary btn-sm">Refresh</button>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>

      <h3>Team Members</h3>
      <div id="teamList" class="mb-4"></div>

      <h3>Advisors</h3>
      <div id="advisorList" class="mb-4"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/assets/js/admin.js" type="module"></script>
</body>
</html>
