<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://pstuec.com/events.html" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0c0032" />
    <title>Events - PSTU Entrepreneurship Club</title>
    <meta name="description" content="Discover upcoming and past events, workshops, competitions and summits at PSTU Entrepreneurship Club." />
    <meta property="og:title" content="Events - PSTU Entrepreneurship Club" />
    <meta property="og:description" content="Explore our upcoming workshops and past event highlights." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pstuec.com/events.html" />
    <meta property="og:image" content="https://pstuec.com/assets/images/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="//unpkg.com">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/enhancements.css" />
    <link rel="icon" href="assets/images/favicon.png" type="image/png" />
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "PSTU Entrepreneurship Club Events",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "organizer": {
            "@type": "Organization",
            "name": "PSTU Entrepreneurship Club",
            "url": "https://pstuec.com/"
        },
        "url": "https://pstuec.com/events.html"
    }
    </script>
</head>

<body>
    <div id="site-header"></div>

    <!-- Events Hero Section -->
    <section id="main" class="hero-section text-white position-relative"
        style="background: linear-gradient(rgba(12,0,50,0.85), rgba(12,0,50,0.85)), url('assets/images/events-hero.jpg') center/cover no-repeat;">
        <div class="container py-5">
            <div class="row py-5">
                <div class="col-lg-8 mx-auto text-center">
                    <h1 class="hero-heading mb-4">Our <span class="gradient-text">Events</span></h1>
                    <p class="lead">Join our exciting programs and workshops</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Upcoming Events -->
    <section class="py-5 bg-light">
        <div class="container">
            <div class="text-center mb-4">
                <h2 class="section-title">Upcoming <span class="text-primary">Events</span></h2>
                <p class="lead">Don't miss these exciting opportunities</p>
            </div>
            <div id="eventFilters" class="filter-bar" data-aos="fade-up"></div>
            <div class="row g-4" id="eventsDynamic" data-aos="fade-up"></div>
        </div>
    </section>

    <!-- Past Events -->
    <section class="py-5">
        <div class="container">
            <div class="text-center mb-4">
                <h2 class="section-title">Past <span class="text-primary">Events</span></h2>
                <p class="lead">See what we've accomplished together</p>
            </div>
            <div id="pastYearFilters" class="filter-bar mb-3" data-aos="fade-up"></div>
            <div class="row g-4" id="pastEventsDynamic" data-aos="fade-up"></div>
        </div>
    </section>

    <div id="site-footer"></div>

    <!-- Back to Top Button -->
    <a href="#" class="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up" aria-hidden="true"></i></a>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="assets/js/includes.js"></script>
    <script defer src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script defer src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script defer src="assets/js/config.js"></script>
    <script defer src="assets/js/script.js"></script>
    <script type="module" src="assets/js/app-dynamic.js"></script>
    <script defer src="assets/js/ui.js"></script>
    <script>
        // Initialize AOS
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
    </script>
</body>

</html>
