<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register for Event - PSTU Entrepreneurship Club</title>
  <meta name="description" content="Register for PSTU Entrepreneurship Club events using a single form." />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#0c0032" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/enhancements.css" />
  <link rel="icon" href="assets/images/favicon.png" type="image/png" />
</head>
<body>
  <div id="site-header"></div>

  <section class="hero-section text-white position-relative" style="background: linear-gradient(rgba(12,0,50,0.85), rgba(12,0,50,0.85)), url('assets/images/events-hero.jpg') center/cover no-repeat;">
    <div class="container py-5">
      <div class="row py-4">
        <div class="col-lg-8 mx-auto text-center">
          <h1 class="hero-heading mb-3">Event Registration</h1>
          <p class="lead mb-0" id="eventContext">Completing your registration...</p>
        </div>
      </div>
    </div>
  </section>

  <section class="py-5 bg-light">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="glass-card p-4">
            <form id="regForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required />
                <div class="invalid-feedback">Please enter your name.</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required />
                <div class="invalid-feedback">Please enter a valid email.</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-control" />
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Department</label>
                  <input type="text" name="department" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Year</label>
                  <input type="text" name="year" class="form-control" />
                </div>
              </div>
              <div class="mt-3 mb-3">
                <label class="form-label">Message (optional)</label>
                <textarea name="message" class="form-control" rows="3" placeholder="Any note for organizers..."></textarea>
              </div>
              <input type="hidden" name="eventSlug" />
              <input type="hidden" name="eventTitle" />
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Submit Registration</button>
                <a href="events.html" class="btn btn-outline-secondary">Back to Events</a>
              </div>
              <div class="mt-3" id="resultMsg"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <a href="#" class="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up" aria-hidden="true"></i></a>

  <script type="module">
    import { events } from './assets/js/data.js';

    const params = new URLSearchParams(location.search);
    const key = params.get('event');
    const ev = events.find(e => (e.slug && e.slug === key) || (String(e.id) === key));
    const title = ev ? ev.title : 'Selected Event';
    document.getElementById('eventContext').textContent = `Registering for: ${title}`;

    const form = document.getElementById('regForm');
    form.elements['eventSlug'].value = key || (ev && (ev.slug || ev.id)) || '';
    form.elements['eventTitle'].value = title;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }
      const data = Object.fromEntries(new FormData(form).entries());
      const api = window.API_BASE_URL || '';
      const result = document.getElementById('resultMsg');
      result.textContent = '';
      try {
        const res = await fetch(`${api}/api/events/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed to submit');
        result.className = 'alert alert-success';
        result.textContent = 'Registration successful! Check your inbox for updates.';
        form.reset();
      } catch (err) {
        result.className = 'alert alert-danger';
        result.textContent = err.message || 'Something went wrong. Please try again.';
      }
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="assets/js/includes.js"></script>
  <script defer src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script defer src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/script.js"></script>
  <script defer src="assets/js/ui.js"></script>
  <script>
    AOS.init({ duration: 800, easing: 'ease-in-out', once: true });
  </script>
</body>
</html>
